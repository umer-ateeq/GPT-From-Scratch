name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # CPU-only torch: the tests use a tiny model, so no GPU is needed and the
      # CUDA wheels would exceed the runner's disk quota.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy tiktoken pytest

      - name: Run tests
        run: python -m pytest tests/ -v

      # The checkpoint is published separately, so CI cannot audit it. This at
      # least proves the audit script parses and runs.
      - name: Check the audit script is runnable
        run: python audit_checkpoint.py --help
